name: web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/get-vcpkg
        with:
          bootstrap: 'false'

      - name: Restore Emscripten SDK
        uses: actions/cache@v4
        with:
          path: .emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile', 'emsdk/emscripten-releases-tags.json', 'emsdk/emsdk_manifest.json', 'cmake/bootstrap-emsdk.cmake') }}

      - name: Build and verify in devcontainer
        uses: ./.github/actions/devcontainer
        with:
          run: |
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
            cmake -P cmake/bootstrap-emsdk.cmake
            cmake --preset wasm32-emscripten-emcc-release
            cmake --build --preset wasm32-emscripten-emcc-release --parallel
            cmake --install build/wasm32-emscripten-emcc-release
            installed=build/wasm32-emscripten-emcc-release/installed/share
            for file in evford/evford.html evford/evford.js evford/evford.wasm \
                        srd-lite/srd-lite.html srd-lite/srd-lite.js srd-lite/srd-lite.wasm srd-lite/srd-lite.data; do
              if [ ! -s "$installed/$file" ]; then
                echo "::error::Missing or empty web asset: $installed/$file"
                exit 1
              fi
            done

      - uses: actions/upload-artifact@v4
        with:
          name: aspire-web
          path: build/wasm32-emscripten-emcc-release/installed/share/evford
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: aspire-web-srd-lite
          path: build/wasm32-emscripten-emcc-release/installed/share/srd-lite
          if-no-files-found: error
