name: steamos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SteamOS is x86_64 glibc Linux, so a native build produces a Steam Deck
  # binary — the sniper base (glibc 2.31) is what makes it run there. The image
  # compiles GCC 15 from source on a cache miss, so allow for that on top of the
  # build itself; cached layers bring a run back to the usual length.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/get-vcpkg
        with:
          bootstrap: 'false'

      - name: Build, test, and package in devcontainer
        uses: ./.github/actions/devcontainer
        with:
          directory: .devcontainer/steamos
          run: |
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
            cmake --preset x64-steamos-gcc-release
            cmake --build --preset x64-steamos-gcc-release --parallel
            ctest --preset x64-steamos-gcc-release --no-tests=ignore
            cmake --install build/x64-steamos-gcc-release
            # The point of the sniper container is a low glibc floor. Assert
            # that nothing in the installed tree references anything newer than
            # sniper's GLIBC_2.31, so a regression (e.g. a base-image bump)
            # that would break the Deck fails loudly here.
            test -x build/x64-steamos-gcc-release/installed/bin/evford
            max=$(find build/x64-steamos-gcc-release/installed -type f \( -name '*.so*' -o -path '*/bin/*' \) \
              -exec objdump -T {} \; 2>/dev/null \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -uV | tail -1)
            echo "highest glibc symbol required: ${max:-none}"
            if [ -n "$max" ] && [ "$(printf '%s\nGLIBC_2.31\n' "$max" | sort -V | tail -1)" != "GLIBC_2.31" ]; then
              echo "::error::installed tree requires $max, above the sniper floor GLIBC_2.31"
              exit 1
            fi
            tar -czf build/aspire-steamos-x64.tar.gz -C build/x64-steamos-gcc-release/installed .

      - uses: actions/upload-artifact@v4
        with:
          name: aspire-steamos-x64
          path: build/aspire-steamos-x64.tar.gz
          if-no-files-found: error
