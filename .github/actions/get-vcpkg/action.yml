name: Get vcpkg
description: Bootstrap the checked-in vcpkg revision and cache compiled dependencies.

inputs:
  bootstrap:
    description: Bootstrap on the runner; disable when bootstrapping inside the devcontainer.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Configure vcpkg
      id: configure
      shell: bash
      run: |
        echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.cache/vcpkg" >> "$GITHUB_ENV"
        echo "VCPKG_BINARY_SOURCES=clear;default,readwrite" >> "$GITHUB_ENV"
        mkdir -p "$GITHUB_WORKSPACE/.cache/vcpkg"
        echo "revision=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: .cache/vcpkg
        # Include the pinned ports and SDK, not just the application manifest.
        # A new commit can save packages after a runner toolchain update.
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ steps.configure.outputs.revision }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**', 'emsdk/emscripten-releases-tags.json') }}-${{ github.sha }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ steps.configure.outputs.revision }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**', 'emsdk/emscripten-releases-tags.json') }}-
          vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-

    - name: Bootstrap vcpkg (Windows)
      if: inputs.bootstrap == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: ./vcpkg/bootstrap-vcpkg.bat -disableMetrics

    - name: Bootstrap vcpkg (Unix)
      if: inputs.bootstrap == 'true' && runner.os != 'Windows'
      shell: bash
      run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
