name: Build in devcontainer
description: Build the project's devcontainer image and run commands inside it.

inputs:
  run:
    description: Bash commands to execute in the checked-out workspace.
    required: true
  directory:
    description: Devcontainer directory holding the Dockerfile, used as the build context.
    required: false
    default: .devcontainer
  image:
    description: >-
      Registry repository to keep the image in, e.g. ghcr.io/owner/repo/name. The image is
      tagged with a hash of the Dockerfile and pulled when that tag exists, so it is built
      only when the Dockerfile changes; the job needs `packages: write`. When empty, the
      image is assembled every run from the GitHub Actions layer cache.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Pull devcontainer image
      id: image
      if: inputs.image != ''
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DOCKERFILE: ${{ inputs.directory }}/Dockerfile
        TOKEN: ${{ github.token }}
        # Fork pull requests get a read-only token, so they build without publishing.
        PUBLISH: ${{ github.event.pull_request.head.repo.fork != true }}
      run: |
        repo="${IMAGE,,}"
        ref="$repo:$(sha256sum "$DOCKERFILE" | cut -c1-16)"
        echo "$TOKEN" | docker login "${repo%%/*}" --username "$GITHUB_ACTOR" --password-stdin
        {
          echo "ref=$ref"
          echo "cache-from=type=registry,ref=$repo:buildcache"
        } >> "$GITHUB_OUTPUT"
        if docker pull "$ref"; then
          echo "pulled=true" >> "$GITHUB_OUTPUT"
        elif [ "$PUBLISH" = true ]; then
          echo "No image for this Dockerfile yet; building and pushing $ref."
          {
            echo "push=true"
            echo "cache-to=type=registry,ref=$repo:buildcache,mode=max,image-manifest=true,oci-mediatypes=true"
          } >> "$GITHUB_OUTPUT"
        fi

    - uses: docker/setup-buildx-action@v3
      if: steps.image.outputs.pulled != 'true'

    - name: Build devcontainer image
      if: steps.image.outputs.pulled != 'true'
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.directory }}
        file: ${{ inputs.directory }}/Dockerfile
        load: true
        push: ${{ steps.image.outputs.push == 'true' }}
        tags: ${{ steps.image.outputs.ref || 'aspire-devcontainer:ci' }}
        # Links a pushed image's package to this repository, which grants the repository access to it.
        labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        cache-from: ${{ steps.image.outputs.cache-from || format('type=gha,scope=devcontainer-{0}', github.workflow) }}
        cache-to: ${{ steps.image.outputs.cache-to || format('type=gha,scope=devcontainer-{0},mode=max', github.workflow) }}

    - name: Run in devcontainer
      shell: bash
      env:
        BUILD_COMMANDS: ${{ inputs.run }}
        IMAGE_REF: ${{ steps.image.outputs.ref || 'aspire-devcontainer:ci' }}
      run: |
        # Preserve workspace paths and file ownership for caches and artifacts.
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
          --workdir "$GITHUB_WORKSPACE" \
          --env HOME=/tmp \
          --env CI=true \
          --env GITHUB_WORKSPACE \
          --env VCPKG_ROOT \
          --env VCPKG_DEFAULT_BINARY_CACHE \
          --env VCPKG_BINARY_SOURCES \
          "$IMAGE_REF" \
          bash -euo pipefail -c "$BUILD_COMMANDS"
